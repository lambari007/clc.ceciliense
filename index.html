<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLC Ceciliense | Filiados</title>
<style>
:root{--green:#173d2d;--green2:#24553d;--gold:#c6a25b;--bg:#f4f1ea;--card:#fff}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f2b25;

  background-image:
    linear-gradient(
      rgba(255,255,255,0.82),
      rgba(255,255,255,0.82)
    ),
    url("https://drive.google.com/uc?export=view&id=1uWalLtcdkY-mOQHIYmNlE4XiRjna6MQ4");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
}
header{background:linear-gradient(135deg,var(--green),#0e281d);color:white;padding:26px 20px;text-align:center;border-bottom:3px solid var(--gold)}
.site-logo{width:150px;height:150px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 12px;background:#0b2117;box-shadow:0 6px 24px rgba(0,0,0,.28)}
header h1{margin:0;font-size:30px;letter-spacing:1px}
header p{margin:10px 0 0;color:#e5d8b9}
@media(max-width:700px){.site-logo{width:115px;height:115px}}
main{max-width:1200px;margin:0 auto;padding:28px 18px 50px}
.section-title{text-align:center;font-size:24px;font-weight:800;color:var(--green);margin:5px 0 22px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:25px}
input,select{width:100%;padding:13px 14px;border:1px solid #d7d2c7;border-radius:10px;background:white;font-size:15px}
.status{min-height:25px;text-align:center;margin:4px 0 16px;color:#5f675f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.08);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px)}
.photo{
    width:100%;
    height:260px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
}
@media (max-width:700px){
    .photo{
        height:220px;
    }

    .photo img{
        width:100%;
        height:100%;
        object-fit:contain;
    }
}
.avatar{font-size:70px;opacity:.45}
.info{padding:16px}
.name{font-size:18px;font-weight:800;color:var(--green);min-height:43px}
.meta{margin-top:7px;color:#687168;font-size:14px}
.badge{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#e5eee8;color:#1f6b3a}
.badge.inativo{background:#f4e3e3;color:#9b3434}
.empty{grid-column:1/-1;text-align:center;padding:35px;background:white;border-radius:14px;color:#6b716c}
footer{text-align:center;padding:20px;color:#6b716c;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.show{display:flex}
.modal-box{position:relative;background:white;border-radius:18px;max-width:560px;width:100%;overflow:hidden}
.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer;z-index:2}
.modal-content{padding:24px}
.modal-content .photo{height:300px;margin:-24px -24px 20px}
.detail{padding:8px 0;border-bottom:1px solid #eee}
.detail b{color:var(--green)}
@media(max-width:700px){.filters{grid-template-columns:1fr}.photo{height:245px}}
</style>
</head>

  <h1>CLUBE DE LAÇO CECILIENSE</h1>
  <p>Tradição, união e valorização dos nossos laçadores</p>
</header>

<main>
  <div class="section-title">FILIADOS EM DESTAQUE</div>

  <div class="filters">
    <input id="q" placeholder="🔎 Pesquise por nome...">
    <select id="category"><option value="">Todas as categorias</option></select>
    <select id="city"><option value="">Todas as cidades</option></select>
  </div>

  <div id="status" class="status">Carregando filiados...</div>
  <div id="grid" class="grid"></div>
</main>

<footer>Clube de Laço Ceciliense • Cadastro atualizado pela planilha oficial</footer>

<div id="modal" class="modal">
  <div class="modal-box">
    <button id="close" class="close">×</button>
    <div id="modalContent" class="modal-content"></div>
  </div>
</div>

<script>
// ABA CADASTRO publicada como CSV
const GOOGLE_SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJPrY8SwHG0yrWDRCO0J5A2iuWE-yC8VKOPUdawq5r5bjlZ7r-sgD6uHTTRqjfUw/pub?gid=644112690&single=true&output=csv";

let membros = [];

function norm(v){
  return String(v ?? "")
    .replace(/^\uFEFF/, "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ");
}

// Parser CSV que aceita vírgulas, ponto e vírgula, aspas e quebras de linha dentro de campos
function parseCSV(text){
  const rows = [];
  let row = [], field = "", quoted = false;

  for(let i=0;i<text.length;i++){
    const c = text[i];
    const n = text[i+1];

    if(c === '"'){
      if(quoted && n === '"'){ field += '"'; i++; }
      else quoted = !quoted;
    }else if(c === ',' && !quoted){
      row.push(field); field = "";
    }else if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && n === '\n') i++;
      row.push(field);
      if(row.some(x => String(x).trim() !== "")) rows.push(row);
      row = []; field = "";
    }else{
      field += c;
    }
  }
  row.push(field);
  if(row.some(x => String(x).trim() !== "")) rows.push(row);

  if(rows.length < 2) return [];

  const headers = rows[0].map(norm);

  function get(obj, aliases){
    for(const a of aliases){
      const target = norm(a);
      const idx = headers.findIndex(h => h === target || h.includes(target));
      if(idx >= 0 && obj[idx] != null && String(obj[idx]).trim() !== "") return String(obj[idx]).trim();
    }
    return "";
  }

  return rows.slice(1).map(r => {
    const nome = get(r,["nome completo","nome","filiado","associado"]);
    const id = get(r,["id associado","id","codigo"]);
    const nascimento = get(r,["data de nascimento","nascimento"]);
    const filiacao = get(r,["data de filiacao","data de filiação","filiacao","filiação"]);
    const status = get(r,["status","situacao","situação"]) || "Ativo";
    const categoria = get(r,["categoria","modalidade"]);
    const cidade = get(r,["cidade","municipio","município"]);
    const foto = get(r,["foto url","link da foto","foto","imagem","url da foto"]);
    const sexo = get(r,["sexo"]);

    return {id,nome,nascimento,filiacao,status,categoria,cidade,foto,sexo};
  }).filter(x => x.nome);
}

function escapeHTML(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function fillSelect(id, values, label){
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(v => `<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`).join("");
  el.value = current;
}

function setupFilters(){
  fillSelect("category",[...new Set(membros.map(x=>x.categoria).filter(Boolean))].sort(),"Todas as categorias");
  fillSelect("city",[...new Set(membros.map(x=>x.cidade).filter(Boolean))].sort(),"Todas as cidades");
}

function photoHTML(m){
  if(m.foto && /^https?:\/\//i.test(m.foto)){

    let foto = m.foto;

    const match = foto.match(/\/d\/([^/]+)/);

    if(match){
      foto = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
    }

    return `<img src="${escapeHTML(foto)}" alt="${escapeHTML(m.nome)}">`;
  }

  return `<div class="avatar">👤</div>`;
}

function render(){
  const q = norm(document.getElementById("q").value);
  const cat = document.getElementById("category").value;
  const city = document.getElementById("city").value;

  const lista = membros.filter(m => {
    const searchable = norm([m.nome,m.categoria,m.cidade,m.status,m.id].join(" "));
    return (!q || searchable.includes(q)) &&
           (!cat || m.categoria === cat) &&
           (!city || m.cidade === city);
  });

  const grid = document.getElementById("grid");
  document.getElementById("status").textContent =
    `${lista.length} filiado(s) encontrado(s)`;

  if(!lista.length){
    grid.innerHTML = '<div class="empty">Nenhum filiado encontrado.</div>';
    return;
  }

  grid.innerHTML = lista.map((m,i) => `
    <article class="card" data-index="${membros.indexOf(m)}">
      <div class="photo">${photoHTML(m)}</div>
      <div class="info">
        <div class="name">${escapeHTML(m.nome)}</div>
        ${m.categoria ? `<div class="meta">🏇 ${escapeHTML(m.categoria)}</div>` : ""}
        ${m.cidade ? `<div class="meta">📍 ${escapeHTML(m.cidade)}</div>` : ""}
        <span class="badge ${norm(m.status).includes("inativ") ? "inativo" : ""}">
          ${escapeHTML(m.status || "Ativo")}
        </span>
      </div>
    </article>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click",() => openModal(membros[Number(card.dataset.index)]));
  });
}

function openModal(m){
  document.getElementById("modalContent").innerHTML = `
    <div class="photo">${photoHTML(m)}</div>
    <h2 style="margin:0 0 14px;color:#173d2d">${escapeHTML(m.nome)}</h2>
    ${m.id ? `<div class="detail"><b>ID Associado:</b> ${escapeHTML(m.id)}</div>` : ""}
    ${m.status ? `<div class="detail"><b>Status:</b> ${escapeHTML(m.status)}</div>` : ""}
    ${m.categoria ? `<div class="detail"><b>Categoria:</b> ${escapeHTML(m.categoria)}</div>` : ""}
    ${m.cidade ? `<div class="detail"><b>Cidade:</b> ${escapeHTML(m.cidade)}</div>` : ""}
    ${m.filiacao ? `<div class="detail"><b>Data de filiação:</b> ${escapeHTML(m.filiacao)}</div>` : ""}
    ${m.nascimento ? `<div class="detail"><b>Data de nascimento:</b> ${escapeHTML(m.nascimento)}</div>` : ""}
  `;
  document.getElementById("modal").classList.add("show");
}

async function load(){
  const status = document.getElementById("status");
  const grid = document.getElementById("grid");

  try{
    status.textContent = "Carregando filiados...";
    const separator = GOOGLE_SHEET_CSV.includes("?") ? "&" : "?";
    const url = GOOGLE_SHEET_CSV + separator + "t=" + Date.now();

    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("Erro HTTP " + r.status);

    const texto = await r.text();
    membros = parseCSV(texto);

    if(!membros.length){
      throw new Error("A planilha foi carregada, mas nenhum nome foi encontrado. Verifique a aba Cadastro e o cabeçalho 'Nome Completo'.");
    }

    setupFilters();
    render();

  }catch(e){
    console.error(e);
    status.textContent = "Erro ao carregar";
    grid.innerHTML = `<div class="empty"><b>Não foi possível carregar os filiados.</b><br><br>${escapeHTML(e.message)}<br><br>Verifique se a aba Cadastro continua publicada como CSV.</div>`;
  }
}

document.getElementById("q").addEventListener("input",render);
document.getElementById("category").addEventListener("change",render);
document.getElementById("city").addEventListener("change",render);
document.getElementById("close").addEventListener("click",()=>document.getElementById("modal").classList.remove("show"));
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id === "modal") document.getElementById("modal").classList.remove("show");
});

load();
</script>
</body>
</html>
